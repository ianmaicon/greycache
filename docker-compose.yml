# GREYCACHE — instalação pública via imagem pronta (sem acesso ao código-fonte)
# Cole este arquivo como Stack no Portainer ou rode: docker compose up -d
services:
  greycache:
    image: ghcr.io/ianmaicon/greycache:latest
    container_name: greycache
    ports:
      - "8090:80"
    restart: unless-stopped

    # SEM VOLUMES — de propósito: este serviço só entrega arquivos estáticos.
    # Os dados do app vivem no navegador/dispositivo de cada usuário
    # (IndexedDB); backup é feito no próprio app (Ajustes → Exportar JSON).

    # Endurecimento: filesystem imutável — o nginx só escreve em cache/pid,
    # que ficam em tmpfs (memória). Container comprometido não persiste nada.
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /run
    security_opt:
      - no-new-privileges:true

    # Saúde do serviço (visível no Portainer e em ferramentas de uptime)
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 5s

    # Limites opcionais — nginx estático usa quase nada; descomente se quiser
    # teto explícito no homelab:
    # mem_limit: 128m
    # cpus: "0.50"

  # ── Sincronização da rede local (OPCIONAL) ─────────────────────────────────
  # Os celulares do grupo (APK ou navegador) trocam as mudanças por aqui, na
  # rede de casa, sem internet. Os pacotes chegam CIFRADOS com a chave do
  # grupo, que nunca sai dos aparelhos: este serviço não consegue ler nada.
  # O endereço para o app é o mesmo do GREYCACHE (ex.: http://192.168.0.10:8090).
  # Não quer sincronizar pela rede? Apague este bloco e o "volumes" do final.
  greycache-sync:
    image: ghcr.io/ianmaicon/greycache-sync:latest
    container_name: greycache-sync
    volumes:
      - greycache-sync-data:/data   # só pacotes cifrados; pode apagar e recomeçar
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    # Código de instalação do grupo: aparece no log na primeira vez
    # ("docker logs greycache-sync"). Para escolher o seu, descomente:
    # environment:
    #   SETUP_CODE: "48271590"
    # mem_limit: 128m

volumes:
  greycache-sync-data:
